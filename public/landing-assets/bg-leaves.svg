<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Dark green leaf background pattern">
  <defs>
    <radialGradient id="base" cx="50%" cy="36%" r="76%">
      <stop offset="0" stop-color="#1f573b"/>
      <stop offset="0.58" stop-color="#0d2f21"/>
      <stop offset="1" stop-color="#05150f"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#bdd27b"/>
      <stop offset="0.42" stop-color="#4f9260"/>
      <stop offset="1" stop-color="#0a2a1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020705" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#base)"/>
  <circle cx="1160" cy="120" r="220" fill="#d1a25d" opacity="0.08"/>
  <circle cx="210" cy="760" r="260" fill="#91b66b" opacity="0.07"/>
  <g filter="url(#soft)" opacity="0.64">
