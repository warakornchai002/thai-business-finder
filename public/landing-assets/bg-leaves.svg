    <ellipse cx="1184" cy="174" rx="150" ry="42" fill="url(#leaf)" transform="rotate(27 1184 174)"/>
    <ellipse cx="1320" cy="608" rx="132" ry="38" fill="url(#leaf)" transform="rotate(-31 1320 608)"/>
    <ellipse cx="260" cy="626" rx="146" ry="40" fill="url(#leaf)" transform="rotate(20 260 626)"/>
    <ellipse cx="670" cy="94" rx="112" ry="32" fill="url(#leaf)" transform="rotate(8 670 94)"/>
    <ellipse cx="854" cy="790" rx="126" ry="35" fill="url(#leaf)" transform="rotate(-16 854 790)"/>
  </g>
  <g fill="none" stroke="#e1bd78" stroke-width="2" opacity="0.12">
    <circle cx="720" cy="452" r="284"/>
    <circle cx="720" cy="452" r="410"/>
    <circle cx="720" cy="452" r="548"/>
  </g>
